<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>333 International Landing Page</title>
    <meta name="theme-color" content="#000000" />

    <!-- External CSS (change to ./assets/style.css if needed) -->
    <link rel="stylesheet" href="./assets/style.css" />

    <!-- Favicons / manifest -->
    <link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="333" />
    <link rel="manifest" href="./assets/site.webmanifest" />

    <!-- Import map for Three.js ES modules -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>

  <body>
    <div id="loading">Loading 3D model…</div>
    <canvas id="stage" aria-label="3D model"></canvas>

    <noscript>
      <div class="noscript-note">
        JavaScript is required. Email us at:
        <a href="mailto:info@333.international">info@333.international</a>.
      </div>
    </noscript>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader.js";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

      // ---------- Config ----------
      const MODEL_URL   = "/assets/base_basic_shaded.glb"; // change if needed
      const FALLBACK_URL= "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb";
      const FIT = {
        normalizeScale: true,  // scale model so its largest side == targetSize
        targetSize    : 2.0,   // world units after normalization
        padding       : 1.2    // 1.0 = tight, >1 adds safe border
      };

      // ---------- No page scrolling ----------
      window.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
      window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

      // ---------- DOM ----------
      const canvas = document.getElementById("stage");
      const loadingEl = document.getElementById("loading");

      // ---------- Three: renderer / scene / camera ----------
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 10000);

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3, 4, 5);
      const rim = new THREE.DirectionalLight(0x66ccff, 0.7);  rim.position.set(-3, -2, -4);
      scene.add(key, rim);

      // Controls: rotate-only
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.rotateSpeed = 0.9;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.75;

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener("resize", () => {
        resize();
        // Re-fit after resize so nothing clips on extreme aspect changes
        if (currentModel) fitToView(currentModel);
      });

      // ---------- Load GLB/GLTF ----------
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
      loader.setDRACOLoader(draco);

      function loadModel(url) {
        return new Promise((resolve, reject) => {
          loader.load(
            url,
            (gltf) => resolve(gltf),
            (evt) => {
              if (evt.total) {
                const pct = Math.round((evt.loaded / evt.total) * 100);
                loadingEl.textContent = `Loading 3D… ${pct}%`;
              } else {
                loadingEl.textContent = "Loading 3D…";
              }
            },
            (err) => reject(err)
          );
        });
      }

      // ---------- Fit helpers ----------
      function centerAndOptionallyNormalize(obj) {
        // Compute initial bounding box
        const box = new THREE.Box3().setFromObject(obj);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        // Move model so its center sits at origin (0,0,0)
        obj.position.sub(center);

        // Optionally normalize scale (so the largest side equals targetSize)
        if (FIT.normalizeScale) {
          const maxSide = Math.max(size.x, size.y, size.z) || 1.0;
          const scale = FIT.targetSize / maxSide;
          obj.scale.multiplyScalar(scale);
        }
      }

      function fitToView(obj) {
        // Recompute bounds AFTER centering/scaling
        const box = new THREE.Box3().setFromObject(obj);
        const size = new THREE.Vector3();
        box.getSize(size);

        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const hFOV = 2 * Math.atan(Math.tan(vFOV / 2) * camera.aspect);

        // distance needed to fit height & width
        const distV = (size.y / 2) / Math.tan(vFOV / 2);
        const distH = (size.x / 2) / Math.tan(hFOV / 2);
        const dist  = Math.max(distV, distH) * FIT.padding;

        camera.position.set(0, 0, dist);
        camera.near = Math.max(0.01, dist * 0.001);
        camera.far  = dist * 1000;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();
      }

      let currentModel = null;

      (async function boot() {
        if (location.protocol === "file:") {
          loadingEl.textContent = "Run via http(s):// (not file://).";
          console.warn("Serve over http:// (e.g., `npx serve`). Browsers block fetches on file://");
        }

        try {
          let gltf;
          try {
            gltf = await loadModel(MODEL_URL);
          } catch {
            gltf = await loadModel(FALLBACK_URL);
          }

          currentModel = gltf.scene || gltf.scenes[0];

          // Make materials a bit friendlier
          currentModel.traverse((o) => {
            if (o.isMesh && o.material && o.material.isMeshStandardMaterial) {
              o.material.roughness ??= 0.5;
              o.material.metalness ??= 0.2;
            }
          });

          centerAndOptionallyNormalize(currentModel);
          scene.add(currentModel);
          fitToView(currentModel);

          loadingEl.style.display = "none";
          animate();
        } catch (e) {
          console.error("Model load error:", e);
          loadingEl.textContent = "Failed to load model. See console.";
        }
      })();

      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      // ---------- First interaction -> mailto ----------
      const TO = "info@333.international";
      const SUBJECT = "Hello from the landing page";
      const BODY = "";

      function buildMailto(to, subject, body) {
        const s = subject ? `?subject=${encodeURIComponent(subject)}` : "";
        const b = body ? (s ? "&" : "?") + `body=${encodeURIComponent(body)}` : "";
        return `mailto:${to}${s}${b}`;
      }
      function launchMailto() {
        const href = buildMailto(TO, SUBJECT, BODY);
        const a = document.createElement("a");
        a.href = href;
        a.style.display = "none";
        document.body.appendChild(a);
        try { a.click(); } catch { window.location.href = href; }
        setTimeout(() => a.remove(), 1000);
      }
      let mailed = false;
      function onFirstInteraction() {
        if (mailed) return;
        mailed = true;
        launchMailto();
      }
      ["pointerdown", "touchstart", "keydown", "wheel"].forEach((ev) =>
        window.addEventListener(ev, onFirstInteraction, { passive: true, once: true })
      );
    </script>
  </body>
</html>
