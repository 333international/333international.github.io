<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>333 International Landing Page</title>
    <meta name="theme-color" content="#000000" />

    <!-- External styles (use absolute path if /assets/style.css exists at site root) -->
    <link rel="stylesheet" href="/assets/style.css" />

    <!-- Icons / manifest (you already used absolute paths here) -->
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="333" />
    <link rel="manifest" href="/assets/site.webmanifest" />
  </head>

  <body>
    <!-- Minimal loading indicator -->
    <div id="loading">Loading 3D model…</div>

    <!-- Full-viewport WebGL canvas -->
    <canvas id="stage" aria-label="3D model"></canvas>

    <noscript>
      <div class="noscript-note">
        JavaScript is required. Email us at:
        <a href="mailto:info@333.international">info@333.international</a>.
      </div>
    </noscript>

    <!-- Three.js (ES modules) -->
    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { DRACOLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js";

      const canvas = document.getElementById("stage");
      const loadingEl = document.getElementById("loading");

      // --------- Renderer / Scene / Camera ---------
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
      camera.position.set(0, 0, 3);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(2, 3, 4);
      const rim = new THREE.DirectionalLight(0x66ccff, 0.7); rim.position.set(-3, -2, -4);
      scene.add(key, rim);

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener("resize", resize);

      const cursor = { x: 0, y: 0 };
      window.addEventListener(
        "pointermove",
        (e) => {
          cursor.x = (e.clientX / window.innerWidth) * 2 - 1;
          cursor.y = (e.clientY / window.innerHeight) * 2 - 1;
        },
        { passive: true }
      );

      // --------- GLTF loader (with Draco) ---------
      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/"); // trailing slash required
      loader.setDRACOLoader(draco);

      // *** Adjust these paths as needed ***
      const MODEL_URL = "/assets/base_basic_shaded.glb"; // absolute path (change if your file lives elsewhere)
      const FALLBACK_URL =
        "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb";

      let pivot = null;

      function fitCameraToObject(object3D, padding = 1.15) {
        const box = new THREE.Box3().setFromObject(object3D);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const maxSize = Math.max(size.x, size.y, size.z);
        const fov = (camera.fov * Math.PI) / 180;
        let dist = (maxSize / (2 * Math.tan(fov / 2))) * padding;
        dist = Math.max(dist, 1.5);

        camera.position.copy(center.clone().add(new THREE.Vector3(dist, dist * 0.35, dist)));
        camera.near = Math.max(0.1, dist * 0.01);
        camera.far = dist * 100;
        camera.updateProjectionMatrix();
        camera.lookAt(center);

        pivot = new THREE.Object3D();
        pivot.position.copy(center);
        scene.add(pivot);
        pivot.add(object3D);
        object3D.position.sub(center);
      }

      function loadModel(url) {
        console.log("[GLTF] loading:", url);
        return new Promise((resolve, reject) => {
          loader.load(
            url,
            (gltf) => { console.log("[GLTF] loaded:", url); resolve(gltf); },
            (evt) => {
              if (evt.total) {
                const pct = Math.round((evt.loaded / evt.total) * 100);
                loadingEl.textContent = `Loading 3D… ${pct}%`;
              } else {
                loadingEl.textContent = "Loading 3D…";
              }
            },
            (err) => {
              console.error("[GLTF] error for", url, err);
              reject(err);
            }
          );
        });
      }

      (async function boot() {
        if (location.protocol === "file:") {
          loadingEl.textContent = "Run via http:// (not file://). Use a local server.";
          console.warn("Serve over http:// (e.g., `npx serve`). Browsers block fetches on file://");
        }

        try {
          let gltf;
          try {
            gltf = await loadModel(MODEL_URL);
          } catch (e) {
            console.warn("Primary model failed, trying fallback:", FALLBACK_URL);
            gltf = await loadModel(FALLBACK_URL);
          }

          const model = gltf.scene || gltf.scenes[0];
          model.traverse((o) => {
            if (o.isMesh && o.material && o.material.isMeshStandardMaterial) {
              o.material.roughness ??= 0.5;
              o.material.metalness ??= 0.2;
            }
          });

          scene.add(model);
          fitCameraToObject(model);
          loadingEl.style.display = "none";
          animate();
        } catch (e) {
          console.error("Final load error:", e);
          loadingEl.textContent = "Failed to load model. See console.";
        }
      })();

      function animate() {
        if (pivot) {
          pivot.rotation.y += 0.005 + cursor.x * 0.01;
          pivot.rotation.x += cursor.y * 0.01;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      // --------- First interaction -> mailto (no overlay) ---------
      const TO = "info@333.international";
      const SUBJECT = "Hello from the landing page";
      const BODY = "";

      function buildMailto(to, subject, body) {
        const s = subject ? `?subject=${encodeURIComponent(subject)}` : "";
        const b = body ? (s ? "&" : "?") + `body=${encodeURIComponent(body)}` : "";
        return `mailto:${to}${s}${b}`;
      }

      function launchMailto() {
        const href = buildMailto(TO, SUBJECT, BODY);
        const a = document.createElement("a");
        a.href = href;
        a.style.display = "none";
        document.body.appendChild(a);
        try { a.click(); } catch { window.location.href = href; }
        setTimeout(() => a.remove(), 1000);
      }

      let mailed = false;
      function onFirstInteraction() {
        if (mailed) return;
        mailed = true;
        launchMailto();
      }
      ["pointerdown", "touchstart", "keydown", "wheel"].forEach((ev) =>
        window.addEventListener(ev, onFirstInteraction, { passive: true, once: true })
      );
    </script>
  </body>
</html>
